.message-body { min-width: 0; }
.message-text { white-space: normal; font-size: 1rem; }
.answer-content { line-height: 1.8; overflow-wrap: anywhere; }
.answer-content > :first-child { margin-top: 0; }
.answer-content > :last-child { margin-bottom: 0; }
.answer-content p { margin: 0 0 1em; }
.answer-content h1, .answer-content h2, .answer-content h3,
.answer-content h4, .answer-content h5, .answer-content h6 {
  color: #173b2d; font-weight: 700; line-height: 1.4; letter-spacing: -.015em;
  margin: 1.65em 0 .6em;
}
.answer-content h1 { font-size: 1.4rem; }
.answer-content h2 { font-size: 1.25rem; }
.answer-content h3 { font-size: 1.125rem; }
.answer-content h4, .answer-content h5, .answer-content h6 { font-size: 1rem; }
.answer-content strong { font-weight: 650; color: #243f32; }
.answer-content em { font-style: italic; }
.answer-content ul, .answer-content ol { padding-left: 1.55em; margin: .5em 0 1.2em; }
.answer-content ul { list-style: disc; }
.answer-content ol { list-style: decimal; }
.answer-content ul ul { list-style: circle; }
.answer-content li { padding-left: .25em; margin: .4em 0; }
.answer-content li::marker { color: #62786b; }
.answer-content li > p { margin: .35em 0; }
.answer-content li > ul, .answer-content li > ol { margin-bottom: .5em; }
.answer-content blockquote { border-left: 3px solid #a4bd84; background: #f5f8f4; margin: 1em 0; padding: .8em 1em; border-radius: 0 10px 10px 0; color: #56675b; }
.answer-content blockquote > :last-child { margin-bottom: 0; }
.answer-content a { color: #2b694c; text-decoration: underline; text-underline-offset: 3px; }
.answer-content a:hover { color: #153e2c; }
.answer-content hr { border: 0; border-top: 1px solid #e4eae6; margin: 1.5em 0; }
.answer-content :not(pre) > code { background: #eff3f0; color: #385541; border: 1px solid #e2e9e4; border-radius: 5px; padding: .12em .35em; font-size: .88em; font-family: ui-monospace, monospace; }
.answer-code { margin: 1em 0 1.25em; border: 1px solid #293d31; border-radius: 12px; overflow: hidden; background: #142019; }
.code-caption { padding: 7px 15px; background: #203329; color: #bccfc2; font-size: .75rem; font-weight: 600; }
.message-text .answer-code pre { margin: 0; border-radius: 0; max-width: 100%; font-size: .875rem; line-height: 1.65; white-space: pre; overflow-x: auto; padding: 16px; }
.answer-table { max-width: 100%; overflow-x: auto; margin: 1em 0 1.25em; border: 1px solid #dfe7e1; border-radius: 10px; }
.answer-table table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.answer-table th { background: #f0f5f1; color: #294335; font-weight: 650; }
.answer-table th, .answer-table td { padding: 10px 14px; text-align: left; min-width: 110px; border-bottom: 1px solid #e5ebe7; }
.answer-table tr:last-child td { border-bottom: 0; }
.answer-table tbody tr:nth-child(even) { background: #fafcfb; }
.answer-content .contains-task-list { list-style: none; padding-left: .2em; }
.answer-content input[type=checkbox] { accent-color: #315a40; margin-right: .55em; }
.answer-content :focus-visible { outline: 2px solid #6d8937; outline-offset: 3px; }
@media(max-width:760px) {
  .message-text { font-size: 1rem; }
  .answer-content h1 { font-size: 1.3rem; }
  .answer-content h2 { font-size: 1.15rem; }
  .answer-table th, .answer-table td { padding: 9px 12px; }
}
